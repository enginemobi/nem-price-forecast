[project]
name = "nemcast"
version = "0.1.0"
description = "Probabilistic NEM spot price forecasts with Timestral"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "timestral",
    "torch>=2.4",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.31",
    "nemosis>=3.8",
    "holidays>=0.50",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "nbconvert>=7",
    "matplotlib>=3.8",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemcast"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
